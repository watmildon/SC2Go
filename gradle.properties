# debug settings in the app
app.streetcomplete.debug=false

# Kotlin
kotlin.daemon.jvmargs=-Xmx4096m

# Gradle
# 8g, not the 4g that is plenty for everything else: linking a *release* Kotlin/Native framework
# runs whole-program optimisation, and its DevirtualizationAnalysis pass builds a constraint graph
# over the whole app that runs out of heap at 4g - "e: Compilation failed: Java heap space", with no
# hint that memory is the problem. Debug never runs that phase, which is why only release hits it.
# It has to be here rather than in kotlin.native.*: the Native compiler runs inside the Gradle
# daemon, so this is the setting it actually reads. Verified: 4g fails in ~1 min, 8g links in ~12.
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.caching=true

# Android
android.enableJetifier=false
android.useAndroidX=true

# Build scripts
app.streetcomplete.POEditorAPIToken=invalid
app.streetcomplete.POEditorCookie=invalid
app.streetcomplete.POEditorPHPSESSID=invalid
app.streetcomplete.GithubApiToken=invalid
